; ============================================================================
; Edrath 4-Tier Scalability System
;
; Tier 0 (Low):   Mobile / Integrated GPU — no Lumen, no VSM, no Nanite
; Tier 1 (Medium): Dedicated GPU < 4GB VRAM — SSAO, CSM shadows, basic Nanite
; Tier 2 (High):   Dedicated GPU 4-6GB — Software Lumen (low), VSM, Nanite
; Tier 3 (Ultra):  RTX 5070 8GB / equivalent — Software Lumen (max), full VSM + Nanite
;
; VRAM-aware budgets at each tier prevent overcommit and page thrashing.
; ============================================================================

; ============== TEXTURE QUALITY ==============
[TextureQuality@0]
r.Streaming.PoolSize=512
r.Streaming.MaxTempMemoryAllowed=64
r.Streaming.MipBias=2
r.MaxAnisotropy=2

[TextureQuality@1]
r.Streaming.PoolSize=1024
r.Streaming.MaxTempMemoryAllowed=128
r.Streaming.MipBias=1
r.MaxAnisotropy=4

[TextureQuality@2]
r.Streaming.PoolSize=1792
r.Streaming.MaxTempMemoryAllowed=192
r.Streaming.MipBias=0
r.MaxAnisotropy=8

[TextureQuality@3]
r.Streaming.PoolSize=2560
r.Streaming.MaxTempMemoryAllowed=256
r.Streaming.MipBias=0
r.MaxAnisotropy=16

; ============== VIEW DISTANCE ==============
[ViewDistanceQuality@0]
r.ViewDistanceScale=0.5
r.StaticMeshLODDistanceScale=0.5
r.SkeletalMeshLODBias=2

[ViewDistanceQuality@1]
r.ViewDistanceScale=0.7
r.StaticMeshLODDistanceScale=0.6
r.SkeletalMeshLODBias=1

[ViewDistanceQuality@2]
r.ViewDistanceScale=0.85
r.StaticMeshLODDistanceScale=0.7
r.SkeletalMeshLODBias=0

[ViewDistanceQuality@3]
r.ViewDistanceScale=1.0
r.StaticMeshLODDistanceScale=0.75
r.SkeletalMeshLODBias=0

; ============== SHADOWS ==============
[ShadowQuality@0]
r.Shadow.Virtual.Enable=0
r.ShadowQuality=1
r.Shadow.CSM.MaxCascades=1
r.Shadow.DistanceScale=0.4
r.Shadow.RadiusThreshold=0.06

[ShadowQuality@1]
r.Shadow.Virtual.Enable=0
r.ShadowQuality=2
r.Shadow.CSM.MaxCascades=2
r.Shadow.DistanceScale=0.6
r.Shadow.RadiusThreshold=0.04

[ShadowQuality@2]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.MaxPhysicalPages=1024
r.Shadow.Virtual.ResolutionLodBiasLocal=0.5
r.Shadow.DistanceScale=0.85
r.Shadow.RadiusThreshold=0.03

[ShadowQuality@3]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.MaxPhysicalPages=2048
r.Shadow.Virtual.ResolutionLodBiasLocal=0.0
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
r.Shadow.Virtual.Cache.StaticSeparate=1
r.Shadow.DistanceScale=1.0
r.Shadow.RadiusThreshold=0.02

; ============== GLOBAL ILLUMINATION ==============
[GlobalIlluminationQuality@0]
; No dynamic GI — baked only
r.DynamicGlobalIlluminationMethod=0
r.Lumen.ScreenProbeGather=0

[GlobalIlluminationQuality@1]
; No dynamic GI — distance field AO for ambient occlusion
r.DynamicGlobalIlluminationMethod=0
r.DistanceFieldAO=1

[GlobalIlluminationQuality@2]
; Software Lumen at reduced probe density — saves VRAM for 4-6GB GPUs
r.DynamicGlobalIlluminationMethod=1
r.Lumen.HardwareRayTracing=0
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.TraceMeshSDFs=0

[GlobalIlluminationQuality@3]
; Software Lumen at maximum probe density — no HWRT, saves 2GB for quality elsewhere
r.DynamicGlobalIlluminationMethod=1
r.Lumen.HardwareRayTracing=0
r.Lumen.ScreenProbeGather.DownsampleFactor=8
r.Lumen.TraceMeshSDFs=1
r.Lumen.ScreenProbeGather.Temporal.MaxFramesAccumulated=8
r.Lumen.FinalGather.Temporal.MaxFramesAccumulated=8

; ============== REFLECTIONS ==============
[ReflectionQuality@0]
r.ReflectionMethod=0

[ReflectionQuality@1]
; Screen-space reflections for medium tier
r.ReflectionMethod=2

[ReflectionQuality@2]
r.ReflectionMethod=1
r.Lumen.Reflections.DownsampleFactor=2

[ReflectionQuality@3]
; Full-resolution Lumen reflections
r.ReflectionMethod=1
r.Lumen.Reflections.DownsampleFactor=1

; ============== ANTI-ALIASING & RESOLUTION ==============
[AntiAliasingQuality@0]
r.AntiAliasingMethod=1
r.ScreenPercentage=50

[AntiAliasingQuality@1]
r.AntiAliasingMethod=2
r.ScreenPercentage=60

[AntiAliasingQuality@2]
r.AntiAliasingMethod=4
r.TSR.History.ScreenPercentage=85
r.ScreenPercentage=67

[AntiAliasingQuality@3]
r.AntiAliasingMethod=4
r.TSR.History.ScreenPercentage=100
r.TSR.ShadingRejection.Flickering=1
r.ScreenPercentage=77

; ============== POST PROCESSING ==============
[PostProcessQuality@0]
r.MotionBlurQuality=0
r.EyeAdaptationQuality=0
r.DepthOfFieldQuality=0
r.BloomQuality=1

[PostProcessQuality@1]
r.MotionBlurQuality=1
r.EyeAdaptationQuality=1
r.DepthOfFieldQuality=1
r.BloomQuality=2

[PostProcessQuality@2]
r.MotionBlurQuality=2
r.EyeAdaptationQuality=2
r.DepthOfFieldQuality=2
r.BloomQuality=3

[PostProcessQuality@3]
r.MotionBlurQuality=3
r.EyeAdaptationQuality=2
r.DepthOfFieldQuality=2
r.BloomQuality=4

; ============== EFFECTS ==============
[EffectsQuality@0]
r.Niagara.QualityLevel=0
r.ParticleLightQuality=0

[EffectsQuality@1]
r.Niagara.QualityLevel=1
r.ParticleLightQuality=0

[EffectsQuality@2]
r.Niagara.QualityLevel=2
r.ParticleLightQuality=1

[EffectsQuality@3]
r.Niagara.QualityLevel=3
r.ParticleLightQuality=2

; ============== FOLIAGE ==============
[FoliageQuality@0]
foliage.DensityScale=0.3
grass.DensityScale=0.3

[FoliageQuality@1]
foliage.DensityScale=0.5
grass.DensityScale=0.5

[FoliageQuality@2]
foliage.DensityScale=0.7
grass.DensityScale=0.7

[FoliageQuality@3]
foliage.DensityScale=0.85
grass.DensityScale=0.85

; ============== SHADING & NANITE ==============
[ShadingQuality@0]
r.MaterialQualityLevel=0
r.Nanite=0
r.Nanite.MaxPixelsPerEdge=2.0
r.Nanite.Streaming.PoolSize=0

[ShadingQuality@1]
r.MaterialQualityLevel=0
r.Nanite=1
r.Nanite.MaxPixelsPerEdge=2.0
r.Nanite.Streaming.PoolSize=384

[ShadingQuality@2]
r.MaterialQualityLevel=1
r.Nanite=1
r.Nanite.MaxPixelsPerEdge=1.5
r.Nanite.Streaming.PoolSize=640

[ShadingQuality@3]
r.MaterialQualityLevel=1
r.Nanite=1
r.Nanite.MaxPixelsPerEdge=1.0
r.Nanite.Streaming.PoolSize=1024

; ============== SHADER COMPILATION ==============
[ConsoleVariables]
; Tuned for Ryzen 7 253x 8C/16T + 16GB DDR5
r.ShaderDevelopmentMode=0
r.ShaderCompiler.MaxShaderJobs=6
r.ShaderCompiler.MaxShaderMemory=1536
