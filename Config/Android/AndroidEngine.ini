; Edrath: The World That Forgot Tomorrow
; Platform-specific engine overrides for Android Mobile devices

[/Script/AndroidPlatformEditor.AndroidSDKSettings]
SDKAPILevel=latest
NDKAPILevel=android-26

[/Script/Engine.RendererSettings]
; --- Mobile Lighting: Disable heavy PC features (Lumen, Nanite, VSM) ---
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Lumen.HardwareRayTracing=0
r.Lumen.ScreenProbeGather=0
r.Nanite=0
r.Shadow.Virtual.Enable=0

; --- Cascaded Shadow Maps (CSM) optimized for Mobile TBDR GPUs ---
r.ShadowQuality=1
r.Shadow.CSM.MaxCascades=2
r.Shadow.DistanceScale=0.65
r.Shadow.RadiusThreshold=0.04

; --- Anti-Aliasing for Mobile ---
; Use FXAA or TAA (AntiAliasingMethod=1 or 2) to save tile-memory bandwidth
r.AntiAliasingMethod=1
r.MobileContentScaleFactor=1.0
r.MobileHDR=1

; --- Mobile Streaming & Texture Budgets (Unified RAM conservation) ---
r.Streaming.PoolSize=640
r.Streaming.MaxTempMemoryAllowed=64
r.Streaming.MipBias=0
r.MaxAnisotropy=2

; --- Mobile Shader & Particle Constraints ---
fx.Niagara.QualityLevel=1
r.DefaultFeature.MotionBlur=0
r.DefaultFeature.Bloom=1
r.DefaultFeature.AutoExposure=1
r.Mobile.DisableVertexFog=1
r.Mobile.EnableMovableDirectionalLights=1
r.Mobile.EnableMovablePointLights=1
r.Mobile.EnableMovableSpotLights=0
