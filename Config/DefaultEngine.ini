[/Script/Engine.RendererSettings]
; ============================================================================
; EDRATH RENDERING CONFIG — Pushing Hardware to Its Limits
; Target: RTX 5070 8GB | Ryzen 7 253x 8C/16T | 16GB DDR5 | 512GB Gen4 NVMe
;
; Strategy: Software Lumen at maximum probe density frees ~2GB VRAM vs HWRT,
;           allowing us to maximize Nanite, VSM, texture, and reflection quality
;           within the 8GB VRAM envelope.
;
; VRAM Budget (~7.8 / 8.0 GB):
;   Texture Streaming Pool .... 2560 MB   (maximum texture fidelity)
;   Nanite Streaming Pool ..... 1024 MB   (full geometric detail)
;   VSM Page Pool (2048 pgs) ... 768 MB   (razor-sharp shadows)
;   Lumen Software Tracing .... 1200 MB   (high probe density GI)
;   Framebuffer + TSR History .. 500 MB
;   Shader / PSO Cache ......... 500 MB
;   Driver + OS Compositor ..... 256 MB
; ============================================================================

; --- Global Illumination (Software Lumen — Maximum Quality) ---
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=0
r.Lumen.HardwareRayTracing.LightingMode=0
; DownsampleFactor=8: 2x probe density vs default 16 — much sharper indirect lighting
r.Lumen.ScreenProbeGather.ScreenTraces=1
r.Lumen.ScreenProbeGather.DownsampleFactor=8
; Full-resolution Lumen reflections (DownsampleFactor=1, was 2)
r.Lumen.Reflections.DownsampleFactor=1
; Mesh SDF tracing for accurate geometry-aware GI
r.Lumen.TraceMeshSDFs=1
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=1
; Maximum temporal accumulation for stable, noise-free GI
r.Lumen.ScreenProbeGather.Temporal.MaxFramesAccumulated=8
r.Lumen.FinalGather.Temporal.MaxFramesAccumulated=8

; --- Virtual Shadow Maps (Maximum Quality within VRAM Budget) ---
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.MaxPhysicalPages=2048
; Zero LOD bias = sharpest possible shadow resolution
r.Shadow.Virtual.ResolutionLodBiasLocal=0.0
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
; Cache static shadows to save GPU time on subsequent frames
r.Shadow.Virtual.Cache.StaticSeparate=1

; --- Nanite (Maximum Geometric Detail) ---
r.Nanite=1
; 1.0 pixels per edge = full triangle-level detail (no visible simplification)
r.Nanite.MaxPixelsPerEdge=1.0
; 1GB Nanite streaming pool — enough for dense open-world geometry
r.Nanite.Streaming.PoolSize=1024

; --- TSR & Dynamic Resolution (Stable 60 FPS Target) ---
r.AntiAliasingMethod=4
r.TSR.History.ScreenPercentage=100
r.TSR.ShadingRejection.Flickering=1
; 77% internal resolution upscaled to native — excellent quality/perf balance
r.ScreenPercentage=77
r.DynamicRes.OperationMode=2
r.DynamicRes.MinScreenPercentage=60.0
r.DynamicRes.MaxScreenPercentage=100.0
r.DynamicRes.TargetedFrameRate=60

; --- Texture & Memory Streaming (2.5GB Pool — Largest Single VRAM Consumer) ---
r.Streaming.PoolSize=2560
r.Streaming.MaxTempMemoryAllowed=256
r.Streaming.UseFixedPoolSize=0
r.Streaming.HiddenPrimitiveScale=0.5
r.Streaming.FullyLoadUsedTextures=0
r.Streaming.MaxNumTexturesToStreamPerFrame=4

; --- Shader Compiler (Ryzen 7 253x + 16GB DDR5) ---
; 6 of 16 logical threads for compilation — leaves headroom for editor + OS
; 1536MB memory cap prevents OOM during heavy shader compilation passes
r.ShaderDevelopmentMode=1
r.ShaderCompiler.MaxShaderJobs=6
r.ShaderCompiler.WorkerProcessPriority=-1
r.ShaderCompiler.MaxShaderMemory=1536
r.ShaderCompiler.bAllowCompilingThroughWorkers=True

; --- Post Processing (High Quality) ---
r.DefaultFeature.AutoExposure=1
r.DefaultFeature.MotionBlur=0
r.BloomQuality=4
r.EyeAdaptationQuality=2
r.DepthOfFieldQuality=2

; --- GPU Performance ---
r.GPUCrashDebugging=0
r.AllowOcclusionQueries=1

; --- Mobile Renderer (Cross-Platform Support) ---
bMobileAllowDistanceFieldAO=0
r.Mobile.EnableMovableDirectionalLights=1
r.Mobile.EnableMovablePointLights=1
r.Mobile.EnableMovableSpotLights=1
r.Mobile.DisableVertexFog=1

